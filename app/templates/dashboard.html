<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
</head>
<body>

<h2>Bienvenido</h2>

<p><a href="/properties/new">Crear Propiedad</a> |
<a href="{{ url_for('logout') }}">Logout</a></p>

<h3>Listado de Propiedades</h3>

<table border="1">
    <tr>
        <th>Titulo</th>
        <th>Direccion</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>

    {% for p in properties %}
    <tr>
        <td>{{ p['titulo'] }}</td>
        <td>{{ p['direccion'] }}</td>
        <td>{{ p['precio'] }}</td>
        <td>
            <!-- ruta correcta para editar -->
            <a href="/properties/edit/{{ p['id'] }}">Editar</a>

            <!-- ruta correcta para eliminar + confirm -->
            <form method="post" action="/properties/delete/{{ p['id'] }}" style="display:inline;" onsubmit="return confirm('Confirmar eliminación?');">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
