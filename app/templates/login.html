<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title>
</head>
<style>
  .error {
    color: red;
    font-weight: bold;
}

.ok {
    color: green;
}
</style>
<body>
  <h2>Login</h2>

  <!-- Mostrar error pasado como variable -->
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <!-- Mantener flashed messages si se usan en otra parte -->
  {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for cat, msg in messages %}
            <li class="{{ 'error' if cat == 'error' else 'ok' }}">{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
  {% endwith %}

  <form method="post">
    <label>Email: <input name="email" type="text" value="{{ request.form.get('email','') }}"></label><br>
    <label>Password: <input name="password" type="password"></label><br>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
